name: Vinted scan

on:
  schedule:
    # every 20 minutes
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 vinted_watch.py

      - name: Run shop scan
        run: python3 shop_watch.py

      - name: Commit updated data
        run: |
          git config user.name "vinted-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json seen_ids.json
          [ -f docs/shop_data.json ] && git add docs/shop_data.json
          [ -f shop_seen_ids.json ] && git add shop_seen_ids.json
          git diff --staged --quiet || git commit -m "Update listings [skip ci]"
          git push
