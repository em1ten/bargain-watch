name: Vinted scan

# The main trigger is an external cron service starting this workflow once
# an hour - see "Reliable scan timing" in the README. GitHub's own
# scheduler is best-effort (it fired the old "*/20" schedule only about 4
# times a day), so this schedule is just a backup in case that stops.
on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never two scans at once: a late one waits rather than racing the push.
concurrency:
  group: vinted-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 vinted_watch.py

      - name: Commit updated data
        run: |
          git config user.name "vinted-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json seen_ids.json
          git diff --staged --quiet || git commit -m "Update listings [skip ci]"
          git pull --rebase
          git push
