name: Vinted daily digest

on:
  schedule:
    # 08:00 UTC daily
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send digest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 digest_send.py

      - name: Commit cleared digest queue
        run: |
          git config user.name "vinted-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digest_pending.json
          git diff --staged --quiet || git commit -m "Clear sent digest [skip ci]"
          git push
